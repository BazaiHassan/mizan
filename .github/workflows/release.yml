name: release

# Builds and attaches binaries when a release is published (release-please
# creates the release after its PR is merged).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux first: static musl binaries run on every distro.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          name="mzn-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE NOTICE CHANGELOG.md "dist/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/mzn.exe" "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
            asset="dist/$name.zip"
          else
            cp "target/${{ matrix.target }}/release/mzn" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            asset="dist/$name.tar.gz"
          fi
          (cd dist && shasum -a 256 "$(basename "$asset")" > "$(basename "$asset").sha256")
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  linux-packages:
    name: deb + rpm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: taiki-e/install-action@v2
        with:
          tool: cross,cargo-deb,cargo-generate-rpm
      - run: cross build --release --locked --target x86_64-unknown-linux-musl
      - run: |
          cargo deb --no-build --no-strip --target x86_64-unknown-linux-musl -o dist/
          cargo generate-rpm --target x86_64-unknown-linux-musl -o dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.deb dist/*.rpm --clobber
