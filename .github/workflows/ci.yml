name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  no-network:
    name: no network crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Fail if an HTTP/TLS client is in the runtime dependency tree
        run: |
          if cargo tree --locked -e normal --prefix none | grep -Ei '^(reqwest|hyper|ureq|curl|isahc|attohttpc|native-tls|rustls|openssl) '; then
            echo "mzn must not depend on network crates" >&2
            exit 1
          fi

  test-ubuntu:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  test-fedora:
    name: test (fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - run: dnf install -y gcc git
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  test-other:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  plugin:
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          for f in plugin/.claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            jq empty "$f"
          done
