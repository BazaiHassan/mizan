[package]
name = "mzn"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Hassan Bazai <bazaee.hassan@gmail.com>"]
description = "Tunes RTK to each project: finds token waste in Claude Code sessions and generates project-specific RTK filters"
license = "Apache-2.0"
repository = "https://github.com/BazaiHassan/mizan"
readme = "README.md"
keywords = ["claude-code", "rtk", "tokens", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mzn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
similar = "2"
toml = "0.9"

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
maintainer = "Hassan Bazai <bazaee.hassan@gmail.com>"
section = "devel"
priority = "optional"
assets = [
  ["target/x86_64-unknown-linux-musl/release/mzn", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/mzn/", "644"],
  ["NOTICE", "usr/share/doc/mzn/", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/x86_64-unknown-linux-musl/release/mzn", dest = "/usr/bin/mzn", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/mzn/README.md", mode = "644", doc = true },
  { source = "NOTICE", dest = "/usr/share/doc/mzn/NOTICE", mode = "644", doc = true },
]
